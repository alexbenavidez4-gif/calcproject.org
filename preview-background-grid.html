<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Preview — Background Grid</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#16324A; --navy-deep:#0F2436; --cyan:#7FB3C7; --chalk:#F3F1E8;
    --orange:#E4572E; --yellow:#F4B942; --graphite:#2A2A28; --graphite-soft:#5B5B57;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:'Inter',sans-serif; color:var(--chalk);
    background-color: var(--navy);
    background-image:
      linear-gradient(rgba(127,179,199,0.09) 1px, transparent 1px),
      linear-gradient(90deg, rgba(127,179,199,0.09) 1px, transparent 1px);
    background-size: 48px 48px;
  }
  .note{ color:var(--yellow); font-family:'IBM Plex Mono',monospace; font-size:12px; text-align:center; padding:16px; letter-spacing:0.05em; text-transform:uppercase; }
  h1,h2{ font-family:'Bebas Neue',sans-serif; letter-spacing:0.03em; margin:0; }
  header{ padding:40px 24px 30px; text-align:center; }
  header h1{ font-size:clamp(2rem,5vw,3.2rem); }
  header h1 span{color:var(--orange);}
  main{max-width:1000px;margin:0 auto;padding:0 20px 60px;}
  .ticket{ background:var(--chalk); color:var(--graphite); border-radius:6px; overflow:hidden; box-shadow:0 24px 60px rgba(0,0,0,0.35); }
  .ticket-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:16px; padding:22px 26px 18px; border-bottom:2px dashed rgba(42,42,40,0.2); }
  .stamp{ font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:var(--orange); border:1.5px solid var(--orange); padding:5px 9px; border-radius:2px; transform:rotate(-2deg); white-space:nowrap; }
  .ticket-head h2{ font-size:2rem; color:var(--navy); }
  .ticket-head p{ margin:6px 0 0; color:var(--graphite-soft); font-size:0.95rem; }
  .receipt-wrap{ background:var(--navy-deep); padding:24px 26px; }
  .receipt{ background:#fff; padding:20px 18px; border-radius:2px; font-family:'IBM Plex Mono',monospace; }
  .receipt .total{ display:flex; justify-content:space-between; align-items:baseline; }
  .receipt .total .amount{ font-size:1.5rem; font-weight:600; color:var(--navy); }
</style>
</head>
<body>
<p class="note">Preview only — grid pattern fills the empty margins</p>
<header>
  <h1>Measure once. Calculate once.<br><span>Buy it right.</span></h1>
</header>
<main>
  <section class="ticket">
    <div class="ticket-head">
      <div><h2>Paint Calculator</h2><p>Figure out how many gallons a room actually needs.</p></div>
      <span class="stamp">Job: Interior Paint</span>
    </div>
    <div class="receipt-wrap">
      <div class="receipt">
        <div class="total"><span>Buy</span><span class="amount">2.00 gal</span></div>
      </div>
    </div>
  </section>
</main>
</body>
</html>
